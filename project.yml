name: Steady
options:
  bundleIdPrefix: com.example.steady   # change to your own reverse-DNS prefix
  deploymentTarget:
    iOS: "17.0"
packages:
  SmartSpectra:
    url: https://github.com/Presage-Security/SmartSpectra-Swift
    exactVersion: 3.5.0
targets:
  Steady:
    type: application
    platform: iOS
    sources:
      - Steady
    dependencies:
      - package: SmartSpectra
    info:
      path: Steady/Info.plist
      properties:
        CFBundleDisplayName: Steady
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: "Steady uses the front camera to read your pulse and breathing while you do a short breathing exercise. Video is not recorded or saved."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.steady.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
